info:
  name: Create a pickup game
  type: http
  seq: 29

http:
  method: POST
  url: http://localhost:9926/api/pickupGames
  body:
    type: json
    data: |+
      {
        "sport": "Hockey",
        "title": "Hockey Tourney",
        "description": "Hockey tournament for all skill levels.",
        "location": "Manhattan, NY",
        "date": "2026-06-01",
        "time": "03:00",
        
        "maxPlayers": 25,
        "skillLevelRequired": "Beginner"
        
        
      }





  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
