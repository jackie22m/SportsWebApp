info:
  name: Create a pickup game
  type: http
  seq: 29

http:
  method: POST
  url: http://localhost:9926/api/pickupGames
  body:
    type: json
    data: |+
      {
        "sport": "Soccer",
        "title": "Soccer Scrimmage!!!",
        "description": "Bring an extra ball",
        "location": "Jonesboro, AR",
        "date": "2026-04-25",
        "time": "01:00",
        
        "maxPlayers": 22,
        "skillLevelRequired": "Advanced"
      }




  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
